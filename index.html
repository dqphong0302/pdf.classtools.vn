    <meta charset="UTF-8" />
    <script>
      // Apply saved theme/locale before first paint (avoids a light flash in dark mode).
      try {
        var t = localStorage.getItem('classtools-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
        if (localStorage.getItem('classtools-locale') === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
